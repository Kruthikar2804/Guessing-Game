<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Guessing Game</title>

    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="game-container">
        <h1>Number Guessing Game !</h1>
        <p>Guess the secret number between <span id="rangeText">1 and ?</span></p>

        <div class="input-area">
            <input type="number" id="guessInput" placeholder="Enter your guess" min="1" />
            <button id="submitGuess" for="guessInput">Submit Guess</button>
        </div>

        <div id="message" class="message"></div>

        <div>
            <strong>Previous Guesses:</strong>
            <div id="previousGuesses" class="previous-guesses"></div>
        </div>

        <button id="restartBtn" class="hidden">🔄 Play Again</button>
    </div>

    <script src="app.js"></script>
</body>

</html>
